# Target model: Tabular ResNet on Covertype, classes 1 vs 2, 10 continuous features,
# 20,000-row stratified subsample. Requires data/covtype.data.gz (docs/DATA.md).
run_name: target_covtype_binary_resnet

data:
  name: covtype_binary     # label 1 = Spruce/Fir, 0 = Lodgepole Pine
  max_samples: 20000       # class-stratified subsample (seeded by split_seed)
  split_seed: 0
  val_frac: 0.15
  test_frac: 0.15
  log1p: false

model:
  d_main: 128
  n_blocks: 4
  d_hidden_factor: 2.0
  activation: gelu
  normalization: batchnorm
  dropout_first: 0.1
  dropout_second: 0.0

training:
  seeds: [0, 1, 2]
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 300
  patience: 30
  device: cpu
