# Target model: Tabular ResNet on MAGIC Gamma Telescope. Requires data/magic04.data (docs/DATA.md).
run_name: target_magic_resnet

data:
  name: magic              # label 1 = gamma (signal), 0 = hadron (background)
  split_seed: 0
  val_frac: 0.15
  test_frac: 0.15
  log1p: false             # features can be negative (e.g. fAsym), so no log transform

model:
  d_main: 128
  n_blocks: 4
  d_hidden_factor: 2.0
  activation: gelu
  normalization: batchnorm
  dropout_first: 0.1
  dropout_second: 0.0

training:
  seeds: [0, 1, 2]
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  max_epochs: 300
  patience: 30
  device: cpu
