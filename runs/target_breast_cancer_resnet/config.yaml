run_name: target_breast_cancer_resnet
data:
  name: breast_cancer
  split_seed: 0
  val_frac: 0.15
  test_frac: 0.15
  log1p: false
model:
  d_main: 128
  n_blocks: 4
  d_hidden_factor: 2.0
  activation: gelu
  normalization: batchnorm
  dropout_first: 0.1
  dropout_second: 0.0
training:
  seeds:
  - 0
  - 1
  - 2
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 300
  patience: 30
  device: cpu
